<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te invitaron a Canchero</title>
<meta name="description" content="Tus goles, asistencias y partidos del torneo ya están cargados. Creá tu cuenta gratis y quedátelos.">
<meta property="og:type" content="website">
<meta property="og:title" id="og-title" content="Te invitaron a Canchero">
<meta property="og:description" id="og-desc" content="Tus estadísticas del torneo ya están cargadas. Creá tu cuenta gratis y quedátelos.">
<meta property="og:image" content="https://cancherofutbolapp.vercel.app/og-black.jpg?v=4">
<meta property="og:image:secure_url" content="https://cancherofutbolapp.vercel.app/og-black.jpg?v=4">
<meta name="theme-color" content="#070907">
<link rel="icon" href="icon-black-192.png">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@400;500;600&display=swap');
  :root{--accent:#baff00;--bg:#070907;--border:#1e201e;--muted:#7a827a;--font:'Outfit',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;min-height:100%;}
  /* Fondo: resplandor verde arriba, como el resto de la app */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(700px 380px at 50% -8%,rgba(186,255,0,.16),transparent 70%);}
  .wrap{position:relative;max-width:460px;margin:0 auto;padding:26px 18px 48px;}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font);
    font-weight:900;font-size:17px;color:var(--accent);letter-spacing:-.5px;margin-bottom:22px;}
  /* Tarjeta principal — liquid glass */
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:24px;
    backdrop-filter:blur(16px);padding:26px 20px;text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.5);}
  .kicker{font-size:10.5px;font-weight:900;letter-spacing:2px;color:var(--accent);margin-bottom:12px;}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;
    justify-content:center;font-family:var(--font);font-size:36px;font-weight:900;color:var(--accent);
    background:rgba(186,255,0,.1);border:3px solid rgba(186,255,0,.75);
    box-shadow:0 0 28px rgba(186,255,0,.28);background-size:cover;background-position:center;}
  h1{font-family:var(--font);font-weight:900;font-size:27px;line-height:1.12;margin-bottom:8px;}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.55;}
  .sub b{color:#fff;font-weight:700;}
  /* Chips de torneo/equipo */
  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:16px 0 4px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:6px 12px;}
  .chip i{color:var(--accent);font-size:14px;}
  /* Estadísticas ya cargadas */
  .stats{display:flex;gap:8px;margin:20px 0 4px;}
  .stat{flex:1;background:rgba(186,255,0,.07);border:1px solid rgba(186,255,0,.2);border-radius:14px;padding:13px 4px;}
  .stat .n{font-family:var(--font);font-size:24px;font-weight:900;color:var(--accent);line-height:1;}
  .stat .l{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;margin-top:5px;}
  .note{display:flex;gap:9px;align-items:flex-start;text-align:left;margin-top:18px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 13px;}
  .note i{color:var(--accent);font-size:17px;flex-shrink:0;margin-top:1px;}
  .note span{font-size:12px;color:#b9c0b9;line-height:1.5;}
  .cta{display:block;width:100%;margin-top:20px;background:linear-gradient(135deg,#baff00,#8fd400);
    color:#000;border:none;border-radius:16px;padding:16px;font-family:var(--font);font-weight:900;
    font-size:15.5px;cursor:pointer;box-shadow:0 8px 26px rgba(186,255,0,.3);text-decoration:none;}
  .cta:active{transform:translateY(1px);}
  .cta2{display:block;width:100%;margin-top:9px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);color:#cfd6cf;border-radius:16px;padding:13px;
    font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;}
  .foot{text-align:center;color:#4d554d;font-size:11px;margin-top:20px;line-height:1.6;}
  .skel{color:var(--muted);text-align:center;padding:50px 0;}
  @media(max-width:400px){h1{font-size:24px;}.avatar{width:84px;height:84px;font-size:31px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i class='bx bxs-zap'></i> CANCHERO</div>
  <div id="app"><div class="skel"><i class='bx bx-loader-alt bx-spin' style="font-size:26px;"></i><br><br>Cargando invitación…</div></div>
  <div class="foot">Canchero es gratis. Tus datos del torneo se te asignan solos<br>cuando entrás con el mismo email.</div>
</div>

<script>
const SUPA_URL='https://dofbxgqzcvfjpnvcvdjb.supabase.co';
const SUPA_KEY='sb_publishable_gPwLXkMHk3HvFz9nm9hgKA_1D0IJBKA';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);

// El registro de Canchero es con Google, así que no se precarga el email: lo que importa
// es que la persona entre con EL MISMO email con el que la anotó la organización, porque
// eso es lo que ata sus datos. Por eso se lo mostramos bien claro.
const REGISTRO_URL='index.html';
function avisoEmail(email){
  if(!email) return '';
  return `<div style="margin-top:14px;background:rgba(186,255,0,.07);border:1px solid rgba(186,255,0,.22);
    border-radius:14px;padding:12px 13px;">
    <div style="font-size:9.5px;font-weight:900;letter-spacing:1.2px;color:var(--accent);margin-bottom:5px;">ENTRÁ CON ESTE EMAIL</div>
    <div style="font-size:13.5px;font-weight:700;word-break:break-all;">${esc(email)}</div>
  </div>`;
}

function pintarError(msg){
  document.getElementById('app').innerHTML=
    `<div class="card"><div class="kicker">INVITACIÓN</div>
      <h1>Sumate a Canchero</h1>
      <p class="sub">${esc(msg)}</p>
      <a class="cta" href="index.html">Crear mi cuenta gratis</a>
    </div>`;
}

async function cargarJugador(id){
  const {data:p}=await sb.from('tournament_players')
    .select('*,tournament_teams(team_name,logo_url),tournaments(name,city,logo_url)')
    .eq('id',id).maybeSingle();
  if(!p){ pintarError('Esta invitación ya no está disponible, pero podés registrarte igual.'); return; }

  const equipo=p.tournament_teams?.team_name||'';
  const torneo=p.tournaments?.name||'';
  const email=p.player_email||'';
  const av=p.avatar_url||p.tournament_teams?.logo_url||'';
  const ini=((p.player_name||'?').trim()[0]||'?').toUpperCase();
  const g=p.goals||0,a=p.assists||0,pj=p.matches_played||0;
  const tieneDatos=g||a||pj;

  document.title=`${p.player_name} · te invitaron a Canchero`;
  const ogt=document.getElementById('og-title');
  if(ogt) ogt.content=`${p.player_name}, tus estadísticas te están esperando`;

  document.getElementById('app').innerHTML=`
    <div class="card">
      <div class="kicker">TE INVITARON A CANCHERO</div>
      <div class="avatar" style="${av?`background-image:url('${esc(av)}')`:''}">${av?'':esc(ini)}</div>
      <h1>${esc(p.player_name)}</h1>
      <p class="sub">${equipo?`Estás anotado en <b>${esc(equipo)}</b>`:'Estás anotado'}${torneo?` para <b>${esc(torneo)}</b>`:''}.</p>
      <div class="chips">
        ${torneo?`<span class="chip"><i class='bx bx-trophy'></i> ${esc(torneo)}</span>`:''}
        ${equipo?`<span class="chip"><i class='bx bx-shield'></i> ${esc(equipo)}</span>`:''}
        ${p.position?`<span class="chip"><i class='bx bx-user'></i> ${esc(p.position)}</span>`:''}
        ${p.number?`<span class="chip"><i class='bx bx-hash'></i> ${esc(p.number)}</span>`:''}
      </div>
      ${tieneDatos?`<div class="stats">
        <div class="stat"><div class="n">${g}</div><div class="l">GOLES</div></div>
        <div class="stat"><div class="n">${a}</div><div class="l">ASISTENCIAS</div></div>
        <div class="stat"><div class="n">${pj}</div><div class="l">PARTIDOS</div></div>
      </div>`:''}
      <div class="note"><i class='bx bx-shield-quarter'></i><span>${tieneDatos
        ? 'Todo esto ya lo cargó la organización del torneo. Al crear tu cuenta con <b>el mismo email</b> se pasa solo a tu perfil y empieza a sumar en el ranking general de Canchero.'
        : 'Creá tu cuenta con <b>el mismo email</b> y todo lo que la organización cargue del torneo se te va a sumar solo en tu perfil y en el ranking general.'}</span></div>
      ${avisoEmail(email)}
      <a class="cta" href="${REGISTRO_URL}">Crear mi cuenta y quedármelas</a>
      <a class="cta2" href="torneo.html?id=${esc(p.tournament_id||'')}">Ver el torneo primero</a>
    </div>`;
}

async function cargarEquipo(id){
  const {data:t}=await sb.from('tournament_teams')
    .select('*,tournaments(name,city)').eq('id',id).maybeSingle();
  if(!t){ pintarError('Esta invitación ya no está disponible, pero podés registrarte igual.'); return; }
  const {count}=await sb.from('tournament_players')
    .select('id',{count:'exact',head:true}).eq('team_id',id);
  const torneo=t.tournaments?.name||'';
  const ini=((t.team_name||'?').trim()[0]||'?').toUpperCase();

  document.title=`${t.team_name} · te invitaron a Canchero`;
  const ogt=document.getElementById('og-title');
  if(ogt) ogt.content=`${t.team_name} ya está anotado en Canchero`;

  document.getElementById('app').innerHTML=`
    <div class="card">
      <div class="kicker">TE INVITARON A CANCHERO</div>
      <div class="avatar" style="${t.logo_url?`background-image:url('${esc(t.logo_url)}')`:''}">${t.logo_url?'':esc(ini)}</div>
      <h1>${esc(t.team_name)}</h1>
      <p class="sub">Tu equipo ya está anotado${torneo?` en <b>${esc(torneo)}</b>`:''}.</p>
      <div class="chips">
        ${torneo?`<span class="chip"><i class='bx bx-trophy'></i> ${esc(torneo)}</span>`:''}
        ${count?`<span class="chip"><i class='bx bx-group'></i> ${count} jugadores cargados</span>`:''}
        ${t.group_letter?`<span class="chip"><i class='bx bx-list-ul'></i> Grupo ${esc(t.group_letter)}</span>`:''}
      </div>
      <div class="stats">
        <div class="stat"><div class="n">${t.wins||0}</div><div class="l">GANADOS</div></div>
        <div class="stat"><div class="n">${t.draws||0}</div><div class="l">EMPATADOS</div></div>
        <div class="stat"><div class="n">${t.points||0}</div><div class="l">PUNTOS</div></div>
      </div>
      <div class="note"><i class='bx bx-shield-quarter'></i><span>Registrate con <b>el mismo email</b> con el que te anotó la organización y el equipo, el plantel y las estadísticas quedan atados a tu cuenta. Es gratis.</span></div>
      ${avisoEmail(t.club_email||'')}
      <a class="cta" href="${REGISTRO_URL}">Crear mi cuenta gratis</a>
      <a class="cta2" href="torneo.html?id=${esc(t.tournament_id||'')}">Ver el torneo primero</a>
    </div>`;
}

(async function(){
  try{
    const p=qs.get('p'), e=qs.get('e');
    if(p) await cargarJugador(p);
    else if(e) await cargarEquipo(e);
    else pintarError('Sumate gratis y llevá tus partidos, goles y estadísticas en un solo lugar.');
  }catch(err){
    console.warn(err);
    pintarError('No pudimos cargar la invitación, pero podés registrarte igual.');
  }
})();
</script>
</body>
</html>
