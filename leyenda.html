<style>
  html,body{ margin:0; padding:0; background:#0a0c0a; color:#fff;
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100%; overscroll-behavior:none; }
  /* El juego se monta en un overlay fijo propio; esto es sólo el telón de fondo
     y lo que se ve mientras carga. */
  #ly-carga{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:#0a0c0a; z-index:10; text-align:center; padding:24px; }
  #ly-carga .marca{ font-weight:900; font-size:13px; letter-spacing:5px; color:#baff00; }
  #ly-carga .tit{ font-weight:900; font-size:34px; line-height:1; }
  #ly-carga .tit span{ color:#baff00; }
  #ly-carga .spin{ font-size:30px; color:#baff00; }
  /* ── ANIMACIÓN DE ENTRADA (corta y vistosa, ~1.1s) ──────────────────────── */
  #ly-carga{ transition:opacity .32s ease, transform .32s ease; }
  #ly-carga.ly-out{ opacity:0; transform:scale(1.04); pointer-events:none; }
  #ly-carga .ly-in{ animation:lyIn .55s cubic-bezier(.2,.9,.3,1) both; }
  #ly-carga .marca.ly-in{ animation-delay:.04s; }
  #ly-carga .tit.ly-in{ animation-delay:.13s; }
  #ly-carga .ly-line.ly-in{ animation-delay:.26s; }
  #ly-carga .ly-line{ width:190px; height:3px; border-radius:3px; background:rgba(255,255,255,.10); overflow:hidden; }
  #ly-carga .ly-line i{ display:block; height:100%; width:0; border-radius:3px; background:#baff00;
    box-shadow:0 0 10px rgba(186,255,0,.7); animation:lyFill 1.05s cubic-bezier(.4,0,.1,1) .28s forwards; }
  @keyframes lyIn{ from{ opacity:0; transform:translateY(15px) scale(.95); } to{ opacity:1; transform:none; } }
  @keyframes lyFill{ from{ width:0; } to{ width:100%; } }
  @media (prefers-reduced-motion: reduce){
    #ly-carga .ly-in, #ly-carga .ly-line i{ animation:none; }
    #ly-carga .ly-line i{ width:100%; }
  }
  #ly-error{ display:none; max-width:340px; font-size:13px; color:#c4ccc0; line-height:1.6; }
  #ly-error a{ color:#baff00; }
  /* PÁGINA PROPIA: acá no existe el nav de la app grande. La regla global de
     style.css baja el modal 62-74px para dejar lugar a ese nav; sin nav, eso es
     una franja negra vacía arriba. En standalone el juego arranca pegado al borde
     (respetando el notch). */
  #carrera-modal{ top: env(safe-area-inset-top, 0px) !important; }
  @media (max-width: 640px){ #carrera-modal{ top: env(safe-area-inset-top, 0px) !important; } }
</style>
</head>
<body>

<div id="ly-carga" title="Tocá para entrar">
  <div class="marca ly-in">MODO CARRERA</div>
  <div class="tit ly-in">CANCHERO<br><span>LEYENDA</span></div>
  <div class="ly-line ly-in" id="ly-spin"><i></i></div>
  <div id="ly-error">
    No se pudo cargar el juego. Probá recargar la página.<br>
    <a href="index.html">Ir a Canchero</a>
  </div>
</div>

<script>
  // Marca de PÁGINA INDEPENDIENTE. canchero-carrera.js la lee para saber que no
  // hay una app alrededor: el botón de salir vuelve a la portada del juego en vez
  // de buscar la pestaña de Juegos, y desde la portada se ofrece ir a Canchero.
  window.CANCHERO_LEYENDA_STANDALONE = true;

  // El juego usa estos tres globales de la app grande. Sin app, valores neutros:
  // se juega igual, como invitado.
  window.escH = window.escH || function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  };
  window.userData = window.userData || {};
</script>

<!-- Supabase es OPCIONAL: sólo se usa para el ranking de leyendas. Si no carga
     (sin red, CDN bloqueado), el juego funciona igual y el ranking sale vacío. -->

          'sb_publishable_gPwLXkMHk3HvFz9nm9hgKA_1D0IJBKA'

<script src="canchero-truco.js?v=20260821l" charset="utf-8"></script>
<script src="canchero-carrera.js?v=20260821l" charset="utf-8"></script>
<script>
  (function(){
    var carga = document.getElementById('ly-carga');
    var spin  = document.getElementById('ly-spin');
    var err   = document.getElementById('ly-error');
    var lanzado = false;
    // La intro se muestra un mínimo para que se vea (no para hacer esperar): si el
    // juego ya está listo, igual se respeta ~1.1s de animación y después entra.
    var minVisible = 1100;
    var t0 = Date.now();
    var skip = false;
    // Tocar la intro entra ya: nunca es una traba.
    if (carga) carga.addEventListener('click', function(){ skip = true; });
    function entrar(){
      if (lanzado) return true;
      if (typeof window._carreraStart !== 'function') return false;
      var espera = skip ? 0 : Math.max(0, minVisible - (Date.now() - t0));
      lanzado = true;
      setTimeout(function(){
        if (carga) carga.classList.add('ly-out');
        setTimeout(function(){
          if (carga) carga.style.display = 'none';
          window._carreraStart();
        }, 320);
      }, espera);
      return true;
    }
    if (!entrar()) {
      // El script todavía no terminó de evaluarse (o falló). Se reintenta un rato
      // antes de mostrar el error, para no asustar en redes lentas.
      var intentos = 0;
      var t = setInterval(function(){
        intentos++;
        if (entrar() || intentos > 40) {
          clearInterval(t);
          if (typeof window._carreraStart !== 'function') {
            if (spin) spin.style.display = 'none';
            if (err) err.style.display = 'block';
          }
        }
      }, 150);
    }
  })();
</script>
</body>
