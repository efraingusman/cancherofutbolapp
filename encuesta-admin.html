<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canchero · Resultados Encuesta MVP</title>
<!-- Gate de admin: sin sesión admin, la página no se muestra y se redirige al home. -->
<style>html,body{background:#070907;color:#070907;}body{visibility:hidden !important;}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const ADMIN_EMAIL = 'neurovidstudioia@gmail.com';
  function kick(){ location.replace('/'); }
  function wait(){
    if (!window.supabase || !window.supabase.createClient) return setTimeout(wait, 40);
    try {
      const sb = window.supabase.createClient('https://dofbxgqzcvfjpnvcvdjb.supabase.co','sb_publishable_gPwLXkMHk3HvFz9nm9hgKA_1D0IJBKA',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'canchero-auth'}});
      sb.auth.getSession().then(function(r){
        const email = ((r&&r.data&&r.data.session&&r.data.session.user||{}).email||'').toLowerCase();
        if (email !== ADMIN_EMAIL) return kick();
        document.documentElement.style.background=''; document.body.style.color=''; document.body.style.visibility='visible';
      }).catch(kick);
    } catch(e){ kick(); }
  }
  wait();
})();
</script>
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<style>
  :root{ --accent:#baff00; --bg:#070907; --panel:#0f120f; --border:#1c1f1c; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px;}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .head i{font-size:30px;color:var(--accent);}
  h1{font-size:22px;font-weight:900;margin:0;}
  .sub{font-size:12px;color:#777;margin-bottom:20px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .kpi .v{font-size:28px;font-weight:900;color:var(--accent);}
  .kpi .l{font-size:10px;color:#888;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:4px;}
  .q{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;}
  .q-title{font-size:14px;font-weight:800;margin-bottom:14px;}
  .q-title span{color:var(--accent);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
  .bar-label{width:42%;color:#cdd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:rgba(255,255,255,0.05);border-radius:8px;height:22px;position:relative;overflow:hidden;}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),#7db500);border-radius:8px;min-width:2px;transition:width .5s;}
  .bar-val{width:64px;text-align:right;color:#fff;font-weight:800;}
  .txt-item{background:rgba(255,255,255,0.03);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:8px;font-size:13px;color:#ddd;line-height:1.5;}
  .txt-item .who{font-size:10px;color:#667;margin-top:4px;}
  .msg{text-align:center;padding:60px 20px;color:#888;}
  .msg i{font-size:48px;color:#333;display:block;margin-bottom:14px;}
  .nps-dist{display:flex;gap:3px;align-items:flex-end;height:70px;margin-bottom:8px;}
  .nps-bar{flex:1;background:rgba(186,255,0,0.2);border-radius:4px 4px 0 0;min-height:2px;position:relative;}
  .nps-bar span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:9px;color:#666;}
  .btn{background:var(--accent);color:#000;border:none;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><i class='bx bx-bar-chart-alt-2'></i><h1>Resultados Encuesta MVP</h1></div>
  <div class="sub">Canchero · Solo vos podés ver esto · <span id="last-update"></span> <button class="btn" style="padding:5px 12px;font-size:11px;margin-left:8px;" onclick="loadResults()">↻ Actualizar</button></div>
  <div id="content"><div class="msg"><i class='bx bx-loader-alt bx-spin'></i>Cargando...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="canchero-encuesta.js"></script>
<script>
const SB_URL='https://dofbxgqzcvfjpnvcvdjb.supabase.co';
const SB_KEY='sb_publishable_gPwLXkMHk3HvFz9nm9hgKA_1D0IJBKA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const Q = window.MVP_SURVEY_QUESTIONS || [];
function esc(s){return (s||'').toString().replace(/</g,'&lt;');}

async function loadResults(){
  const c = document.getElementById('content');
  c.innerHTML = '<div class="msg"><i class="bx bx-loader-alt bx-spin"></i>Cargando respuestas...</div>';
  // Necesita sesión del dueño (RLS solo deja ver al owner)
  const { data: { session } } = await sb.auth.getSession();
  if (!session){
    c.innerHTML = '<div class="msg"><i class="bx bx-lock-alt"></i>Acceso restringido.<br><br>Iniciá sesión en Canchero con tu cuenta de dueño (en la app) y volvé a abrir esta página. Comparten el mismo navegador, así que tomará tu sesión automáticamente.<br><br><a href="index.html" style="color:var(--accent);">Ir a Canchero</a></div>';
    return;
  }
  const { data, error } = await sb.from('mvp_survey').select('*').order('created_at',{ascending:false}).limit(2000);
  if (error){ c.innerHTML = '<div class="msg"><i class="bx bx-error"></i>'+esc(error.message)+'</div>'; return; }
  if (!data || !data.length){ c.innerHTML = '<div class="msg"><i class="bx bx-message-square-dots"></i>Todavía no hay respuestas.<br>Compartí la encuesta desde la app (banner en el feed).</div>'; return; }
  document.getElementById('last-update').textContent = data.length + ' respuestas · ' + new Date().toLocaleString('es-UY');

  // KPIs
  const npsItem = Q.find(q=>q.type==='nps');
  let npsScore='—', npsArr=[];
  if (npsItem){
    npsArr = data.map(d=>d.answers&&d.answers[npsItem.id]).filter(v=>typeof v==='number');
    if (npsArr.length){ const prom=npsArr.filter(n=>n>=9).length, det=npsArr.filter(n=>n<=6).length; npsScore = Math.round((prom-det)/npsArr.length*100); }
  }
  let html = '<div class="kpis">'+
    '<div class="kpi"><div class="v">'+data.length+'</div><div class="l">Respuestas</div></div>'+
    '<div class="kpi"><div class="v">'+npsScore+'</div><div class="l">NPS (-100 a 100)</div></div>'+
    '<div class="kpi"><div class="v">'+(npsArr.length?(npsArr.reduce((a,b)=>a+b,0)/npsArr.length).toFixed(1):'—')+'</div><div class="l">Recomendación prom.</div></div>'+
    '</div>';

  // Por pregunta
  Q.forEach(function(item, idx){
    html += '<div class="q"><div class="q-title"><span>'+(idx+1)+'.</span> '+esc(item.q)+'</div>';
    if (item.type==='single' || item.type==='multi'){
      const counts = {}; item.opts.forEach(o=>counts[o]=0); let total=0;
      data.forEach(function(d){ const a=d.answers&&d.answers[item.id]; if(a==null) return;
        const vals = Array.isArray(a)?a:[a]; vals.forEach(function(v){ if(counts[v]!=null){counts[v]++; total++;} }); });
      const max = Math.max(1, ...Object.values(counts));
      item.opts.forEach(function(o){ const ct=counts[o]; const pct=total?Math.round(ct/total*100):0; const w=Math.round(ct/max*100);
        html += '<div class="bar-row"><div class="bar-label">'+esc(o)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;"></div></div><div class="bar-val">'+ct+' · '+pct+'%</div></div>';
      });
    } else if (item.type==='nps'){
      const dist = Array.from({length:11},()=>0); npsArr.forEach(n=>{ if(n>=0&&n<=10) dist[n]++; });
      const mx = Math.max(1,...dist);
      html += '<div class="nps-dist">'+dist.map(function(ct,n){ return '<div class="nps-bar" style="height:'+Math.round(ct/mx*100)+'%;background:'+(n>=9?'rgba(63,185,80,0.7)':n<=6?'rgba(255,85,85,0.5)':'rgba(186,255,0,0.4)')+';"><span>'+n+'</span></div>'; }).join('')+'</div><div style="height:10px;"></div>';
    } else {
      const txts = data.map(d=>({t:d.answers&&d.answers[item.id], e:d.user_email})).filter(x=>x.t&&String(x.t).trim());
      if (!txts.length){ html += '<div style="color:#666;font-size:12px;">Sin respuestas todavía.</div>'; }
      else { html += txts.map(function(x){ return '<div class="txt-item">'+esc(x.t)+'<div class="who">'+esc(x.e||'anónimo')+'</div></div>'; }).join(''); }
    }
    html += '</div>';
  });
  c.innerHTML = html;
}
loadResults();
</script>
</body>
</html>
